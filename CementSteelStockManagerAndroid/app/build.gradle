plugins {
    id 'com.android.application'
}

android {
    namespace 'com.manan.stockmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.manan.stockmanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.google.api-client:google-api-client-android:2.7.2'
    implementation 'com.google.http-client:google-http-client-gson:1.45.3'
    implementation 'com.google.http-client:google-http-client-android:1.45.3'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240509-2.0.0'
}
